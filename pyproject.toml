[project]
name = "tutor"
version = "0.1.0"
description = "Agent-agnostic harness for co-writing paper-style tutorials (Markdown + math + HTML -> PDF)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",          # MIT
    "pypandoc-binary>=1.13", # wrapper MIT; bundled pandoc binary GPL-2.0+ (invoked as a CLI tool)
]

[project.scripts]
tutor = "tutor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]          # MIT

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
