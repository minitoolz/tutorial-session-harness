# Phrases flagged by `uv run tutor review`.
# Keep this shipped list SMALL: only expressions that read badly for *every* reader.
# Reader-specific confusions go in skills.local/clear-writing/phrases.yaml (gitignored),
# same format. Patterns are case-insensitive Python regexes.

phrases:
  - pattern: "버그를\\s*밟"
    lang: ko
    why: "made-up idiom; Korean developers don't say this"
    suggest: "버그를 만났다 / 버그가 있었다"
  - pattern: "을\\s*가지(고|는|며)\\s*있"
    lang: ko
    why: "translationese of 'has/have'"
    suggest: "~이 있다 / ~한다"
  - pattern: "되어지"
    lang: ko
    why: "double passive"
    suggest: "된다 / 했다"
  - pattern: "에\\s*대한\\s+\\S+에\\s*대한"
    lang: ko
    why: "stacked '에 대한'"
    suggest: "restructure the sentence"
  - pattern: "\\bdelve\\b"
    lang: en
    why: "filler verb typical of generated text"
    suggest: "look at / explain"
  - pattern: "\\b(tapestry|testament to|in the realm of)\\b"
    lang: en
    why: "ornamental filler"
    suggest: "say the plain thing"

hedges:
  - pattern: "may not (apply|generalize|hold|be representative)"
    why: "defensive disclaimer"
    suggest: "delete, or state the specific condition and its effect"
  - pattern: "results (may|might|can) vary"
    why: "defensive disclaimer"
    suggest: "delete"
  - pattern: "(it is|it's) (important|worth) (to note|noting)"
    why: "filler lead-in"
    suggest: "state the point directly"
  - pattern: "\\bplease (note|consult|refer to)\\b"
    why: "filler / deflection"
    suggest: "delete, or cite the exact section"
  - pattern: "this is (a|an) (simplification|oversimplification)"
    why: "self-protective"
    suggest: "say what is simplified and when it matters, or delete"
  - pattern: "(your|the) (mileage|environment|setup) may"
    why: "defensive disclaimer"
    suggest: "delete"
  - pattern: "환경에\\s*따라\\s*(결과가\\s*)?(다를|달라질)\\s*수"
    lang: ko
    why: "defensive disclaimer"
    suggest: "삭제, 또는 구체적인 조건과 영향을 쓰기"
  - pattern: "참고로"
    lang: ko
    why: "filler lead-in; often signals a hedge"
    suggest: "핵심만 쓰기"
  - pattern: "주의할\\s*(필요가|점은)"
    lang: ko
    why: "filler lead-in"
    suggest: "주의할 내용을 바로 쓰기"
  - pattern: "일반화(하기는|하기|할 수는)\\s*(어렵|없)"
    lang: ko
    why: "defensive disclaimer"
    suggest: "삭제, 또는 어떤 조건에서 달라지는지 구체적으로"

# Tokens that look like opaque index labels but are standard names.
label_allowlist: [L0, L1, L2, F1, R2, H1, H2, H3, H4, H5, H6, T4, L4, A10, K80, P4, C4, S3, EC2, ISO27001, SHA2, MD5, IPv4, IPv6, UTF8, X11, Q4, D3]

# Markers that link a sentence to the one before it (connectives, references back, reason
# endings). `tutor review` flags a paragraph where more than `review.max_unlinked_sentences`
# sentences in a row (after the first) match none of these: see clear-writing §2.
# Patterns are matched against the whole sentence; anchor them with ^ or $.
connectives:
  - pattern: "^(so|thus|therefore|hence|as a result|because|but|however|yet|still|instead|in contrast|conversely|on the other hand|that is|in other words|for example|for instance|in particular|specifically|also|moreover|furthermore|in addition|first|second|third|next|then|finally|lastly|meanwhile|here|now|otherwise|similarly|likewise|in short|overall|together|to do this|in this case)\\b"
    lang: en
  - pattern: "^(this|these|that|those|such|it|its|they|their|both|each)\\b"
    lang: en
    why: "a reference back to the previous sentence"
  - pattern: "^(그래서|따라서|그러므로|그 결과|이 때문에|그러나|하지만|그런데|반면|반대로|대신|즉|다시 말해|예를 들어|예컨대|특히|또한|또|게다가|더구나|먼저|우선|첫째|둘째|셋째|넷째|다음으로|이어서|이후|그다음|그 뒤|마지막으로|끝으로|결국|요약하면|정리하면|이때|이 경우|이렇게|이처럼|그러면|그렇다면|한편|물론|실제로|구체적으로|여기서|이를 위해|그래도|그 대신)(?=[\\s,])"
    lang: ko
  - pattern: "^(이|그|이런|그런|이러한|그러한|이것|그것|이들|그들|이와|두|세|둘 다|모두)(?=[\\s은는이가을를의도])"
    lang: ko
    why: "a reference back to the previous sentence"
  - pattern: "(때문이다|덕분이다|뜻이다|셈이다|까닭이다)[.!?]?$"
    lang: ko
    why: "the sentence explains the previous one"
